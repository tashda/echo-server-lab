name: CI

# Unit tests: recipes, packs and topologies are valid, the TDS/PostgreSQL/MySQL decoders, the
# certificate issuer, the tar writer. The integration tests need a lab host
# (SERVERLAB_INTEGRATION=1) and run from a machine that can reach one.
#
# While this repository is private, macOS minutes count 10x against the free allowance, so CI only
# checks pull requests (and runs by hand). The same checks run before every push with
# `Scripts/ci-local.sh --install`.
on:
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Unit tests
        run: swift test --skip-build --filter "ServerLabKitTests|TDSSpecTests|ServerLabClientTests"
